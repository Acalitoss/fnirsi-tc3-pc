[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fnirsi-tc3-pc"
version = "1.1.0.dev1"
description = "Experimental PC oscilloscope interface and USB firmware patch for FNIRSI DSO-TC3 V0.3"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["pyserial>=3.5,<4"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Operating System :: Microsoft :: Windows", "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)"]

[project.optional-dependencies]
firmware = ["keystone-engine==0.9.2", "capstone>=5,<6", "unicorn>=2.1,<3"]
dev = ["build>=1,<2"]

[project.gui-scripts]
fnirsi-tc3 = "fnirsi_tc3.scope:main"

[project.scripts]
fnirsi-tc3-read = "fnirsi_tc3.driver:main"

[tool.setuptools.packages.find]
include = ["fnirsi_tc3*"]
